<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(#7ad0ff,#c8f2ff 40%,#d6f5b8);min-height:100vh;color:#27324a;padding-bottom:150px}

.st{background:#fff;border:3px solid #222;border-radius:14px;padding:8px;text-align:center;font-weight:700}.st b{display:block;font-size:22px;color:#e3350d}

<div class="card"><b>各單元完成率</b><br>${unitRows}</div><div class="card"><b>最需要加強的前 20 個單字</b><br>${weak.map(w=>`<span class="tag">${esc(w.en)} ${esc(w.zh||w.add)} ✘${rd(w).w}</span>`).join('')||'尚無錯題'}</div>
<div class="card"><b>經常答錯／已熟練／尚未學習</b><br>熟練：${W.filter(w=>rd(w).m).map(w=>esc(w.en)).join('、')||'—'}<br><br>未學習：${W.filter(w=>!rd(w).s).map(w=>esc(w.en)).join('、')||'—'}</div><div class="card"><b>近 28 天學習紀錄</b><div class="cal">${cal}</div></div>
<div class="card"><b>設定</b><p>每日新單字目標 <input type="number" min="1" max="50" value="${st.newGoal}" onchange="S.set.newGoal=+this.value||10;save()"></p><p>每日複習目標 <input type="number" min="1" max="50" value="${st.revGoal}" onchange="S.set.revGoal=+this.value||5;save()"></p><p>每日遊戲時間建議上限（分）<input type="number" min="5" max="300" value="${st.limit}" onchange="S.set.limit=+this.value||60;save()"></p><p><label><input type="checkbox" ${st.sound?'checked':''} onchange="S.set.sound=this.checked;save()"> 開啟音效</label></p><p><label><input type="checkbox" ${st.unl?'checked':''} onchange="S.set.unl=this.checked;save()"> 允許無限練習（關閉則達上限後提醒休息）</label></p><p><label><input type="checkbox" ${st.gym?'checked':''} onchange="S.set.gym=this.checked;save()"> 開啟道館挑戰</label></p></div>
<div class="card"><b>備份與還原</b><br><button class="btn b" onclick="expo()">⬇ 匯出學習紀錄</button><label class="btn w" style="display:inline-block">⬆ 匯入<input type="file" accept=".json" hidden onchange="impo(this)"></label><button class="btn r" onclick="resetAll()">🗑 重置遊戲資料</button></div><button class="btn" onclick="go('home')">返回</button>`)}
function expo(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pokemon-english-'+td()+'.json';a.click()}
function impo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(typeof o!=='object'||!o.words)throw 0;localStorage.setItem(KEY,JSON.stringify(o));S=load();save();alert('匯入成功！');go('home')}catch(e){alert('檔案格式不正確')}};r.readAsText(f)}
function resetAll(){if(confirm('確定要清除所有學習資料？')&&confirm('再確認一次：資料將無法復原！')){localStorage.removeItem(KEY);S=def();save();go('home')}}
/* ===== 計時與啟動 ===== */
setInterval(()=>{if(document.hidden)return;day().t+=10;S.time+=10;if(!S.set.unl&&Math.round((day().t||0)/60)===S.set.limit)say('今天已達建議時間，休息一下眼睛吧！');save()},10000);
daily();go('home');
</script></body></html>
